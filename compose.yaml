name: cerium
services:
  web:
    build:
      context: ./web
      secrets: [heroui_token]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    environment:
      CERIUM_WEBHOOK_SECRET: ${CERIUM_WEBHOOK_SECRET:?Set a 32+ character shared secret}
      CERIUM_BACKEND_URL: http://127.0.0.1:8091
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes: [web-data:/app/data]
    restart: unless-stopped
    init: true
    stop_grace_period: 180s
  sync:
    build: .
    # Two containers and two databases; only the network namespace is shared.
    # The worker is not exposed to the host and webhooks can use localhost.
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
        restart: true
    environment:
      CERIUM_WEBHOOK_SECRET: ${CERIUM_WEBHOOK_SECRET:?Set a 32+ character shared secret}
      CERIUM_WEBHOOK_URL: http://127.0.0.1:3000/api/webhooks/sync
      CERIUM_TURNSTILE_SOLVER_URL: ${CERIUM_TURNSTILE_SOLVER_URL:-http://127.0.0.1:8092}
      CERIUM_MODEL_PROBES_PER_RUN: ${CERIUM_MODEL_PROBES_PER_RUN:-4}
    volumes: [sync-data:/data]
    restart: unless-stopped
    init: true
    stop_grace_period: 180s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8091/healthz]
      interval: 30s
      timeout: 3s
      start_period: 5s
  solver:
    profiles: [solver]
    build: ./solver
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 256
volumes:
  web-data:
  sync-data:
secrets:
  heroui_token:
    environment: HEROUI_SETUP_TOKEN
